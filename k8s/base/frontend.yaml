# Two containers, one pod: web (Caddy, serves the SPA and proxies /api) and
# moderator (the Go REST+SSE backend). They share this pod's network
# namespace, which is what makes the Caddyfile's {$BACKEND_ADDR:localhost:8080}
# default correct here — see frontend/Caddyfile's own comment. Compose keeps
# these as two separate containers/services instead (BACKEND_ADDR=moderator:8080).
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: kaigi
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: kaigi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: web
          image: kaigi-frontend
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
        - name: moderator
          image: kaigi-backend
          command: ["/app/moderator"]
          envFrom:
            - configMapRef:
                name: kaigi-config
          env:
            - name: ADDR
              value: ":8080"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
