apiVersion: v1
kind: Service
metadata:
  name: discovery
  namespace: kaigi
spec:
  selector:
    app: discovery
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery
  namespace: kaigi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery
  template:
    metadata:
      labels:
        app: discovery
    spec:
      containers:
        - name: discovery
          image: kaigi-backend
          command: ["/app/discovery"]
          envFrom:
            - configMapRef:
                name: kaigi-config
          env:
            - name: ADDR
              value: ":8081"
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
