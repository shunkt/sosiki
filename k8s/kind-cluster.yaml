kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # ingress-nginx listens on the node's 80/443 (hostPort) once installed
      # with its kind provider manifest — this just makes the node's own
      # ports reachable from the Mac.
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # MinIO's NodePort (see overlays/local's patch) — presigned URLs the
      # browser opens must resolve outside the cluster.
      - containerPort: 30900
        hostPort: 9000
        protocol: TCP
